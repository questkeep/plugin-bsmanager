[package]
name = "bsmanager"
description = "Questkeep store plugin: lists the Beat Saber instances managed by BSManager"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/questkeep/plugin-bsmanager"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# TEMPORARY: the SDK APIs this plugin uses (known_folder, registry, host_path) are in no Questkeep
# release yet, so this points at the commit that adds them (branch worktree-plugin-permissions).
# Before releasing, switch to the release tag that contains them (v0.7.0) and delete this comment.
questkeep-plugin-sdk = { git = "https://github.com/questkeep/questkeep", rev = "14f5b737a0874251837cb0837268049d137f3b9b" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
opt-level = "s"
lto = true
strip = true

# To develop against a local checkout of Questkeep instead of the tagged release, add this to a
# `.cargo/config.toml` of your own (not committed) or temporarily here:
#
#   [patch."https://github.com/questkeep/questkeep"]
#   questkeep-plugin-sdk = { path = "../questkeep/crates/questkeep-plugin-sdk" }
