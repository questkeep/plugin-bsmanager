name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Checks and package
    # Linux is enough: the plugin only returns mount paths (/instances/...) and builds to wasm32-wasip2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: Release scripts and packaging tests
        run: node --test scripts/release/*.test.mjs scripts/*.test.mjs

      - name: Build provider.wasm
        run: sh ./build.sh

      # Also checks plugin.json against the host's rules and that provider.wasm exists.
      - name: Pack
        run: node scripts/pack.mjs

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: dist/*.zip
          retention-days: 14
          if-no-files-found: error

  changeset:
    name: Changeset reminder
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Informational only: never fails the build.
      - name: Warn when a code change has no changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          code="$(printf '%s\n' "$changed" | grep -Ev '^$|^docs/|^\.github/|\.md$' || true)"
          if [ -z "$code" ]; then
            echo "Only docs, workflow or markdown files changed: no changeset needed."
          elif printf '%s\n' "$changed" | grep -Eq '^\.changeset/.+\.md$'; then
            echo "Changeset found."
          else
            echo "::warning title=No changeset::This pull request changes code but adds no changeset. If the change is user-visible, run 'npm run changeset -- add <major|minor|patch> \"summary\"' (see docs/RELEASING.md)."
          fi
